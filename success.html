<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Received | SHO SHO</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(180deg, #fff7f3 0%, #f8efe7 100%);
      color: #3d2b1f;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .success-box {
      max-width: 450px;
      background: white;
      padding: 35px 25px;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #d94f8b;
      margin-bottom: 15px;
    }

    p {
      line-height: 1.7;
      color: #7a5a48;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 999px;
      background: #d94f8b;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="success-box">
    <h1>Thank You!</h1>

    <p>Your order has been received.</p>

    <p>
      Please contact us through Instagram DM and send your payment receipt
      to confirm your order.
    </p>

</html>
